# Coverage is reported here, never enforced: the API's floor is the pytest gate in CI,
# and a missing or late upload must not turn a pull request red.
codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# One flag per project. The Node uploads are flagged with their directory name (web, core).
flags:
  api:
    paths:
      - apps/api/
  web:
    paths:
      - apps/web/
  core:
    paths:
      - packages/core/

# coverage.xml names the API files relative to apps/api/src; the Node lcov paths
# already arrive prefixed with their workspace directory.
fixes:
  - "^periplo/::apps/api/src/periplo/"
