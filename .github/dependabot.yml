# Weekly dependency updates. Dependabot names its branches dependabot/<ecosystem>/..., which
# [tool.semantic_branch] in apps/api/pyproject.toml ignores: an update is released by the
# next feature or fix, never on its own.
version: 2
updates:
  # The API is locked with uv (apps/api/uv.lock); the uv ecosystem updates the lock with it.
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # One lock for the npm workspaces (apps/web, packages/core), at the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
