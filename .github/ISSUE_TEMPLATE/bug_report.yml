name: Bug report
description: Report something in Periplo that does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search the existing issues first.
        **Security vulnerabilities must not be reported here**: follow SECURITY.md instead.
        Remove credentials, tokens and personal data from anything you paste.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Periplo with ...
        2. Open ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Periplo version
      description: Release, image tag or commit.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run Periplo?
      options:
        - Container image
        - Docker Compose
        - From source
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, data sources and any relevant configuration.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste log output here. It is formatted as code automatically.
      render: text
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
