# Asks every external contributor to sign the CLA (CLA.md) once, by commenting on the pull request.
# Signatures are stored as JSON on the cla-signatures branch of this repository.
#
# pull_request_target runs with a write token, so this workflow must never check out or run code
# from the pull request: the action only calls the GitHub API.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, reopened, synchronize]

permissions: {}

jobs:
  CLAAssistant:
    # Public repositories only. Comments count only on pull requests and only when they sign or ask
    # for a recheck; the action itself validates the exact signing phrase.
    if: >-
      github.event.repository.private == false && (
        github.event_name == 'pull_request_target' || (
          github.event.issue.pull_request &&
          (contains(github.event.comment.body, 'recheck') ||
           contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize runs per pull request so two signature commits never race. The group sits on the
    # job, after the filter above, so unrelated comments never queue in it.
    concurrency:
      group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: write # re-run the failed check after a contributor signs
      contents: write # commit signatures to the cla-signatures branch
      pull-requests: write # comment on, lock and unlock the pull request
    steps:
      - name: Check CLA signatures
        uses: iainmcgin/cla-github-action@0d27e5a16278d4adb6b0c4b92f08ad27b0a21dc8 # v3.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/master/CLA.md
          path-to-signatures: signatures/version1/cla.json
          # The action commits the signatures to this branch.
          branch: cla-signatures
          # Maintainers, bots, and the noreply@anthropic.com identity of AI co-author trailers,
          # matched by exact email. The person who opens a pull request still has to sign.
          allowlist: the-reacher-data,dependabot[bot],github-actions[bot],noreply@anthropic.com
