# Checks of every pull request and of every push to master. Each check job calls one
# reusable workflow of MassiveDataScope/loom-actions, pinned by commit, with only the
# permissions that workflow's jobs ask for. `gate` is the single required check: it fails
# unless every check job succeeded. Codecov and Sonar report without blocking.
# `testpypi` is not a check and `gate` does not wait for it: on a pull request from this
# repository it publishes the API package to TestPyPI as a development prerelease.
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  python:
    permissions:
      contents: read
      pull-requests: write # the quality report comment
    uses: MassiveDataScope/loom-actions/.github/workflows/python-service-ci.yml@1260b7861a6e5013daf36396fb4782c41e5a1c28 # v1.10.0
    with:
      python-version: "3.14"
      python-versions: '["3.12", "3.14"]'
      working-directory: apps/api
      semantic-branch-config: apps/api/pyproject.toml
      coverage-threshold: 97
      image: true
      image-context: .
      dockerfile: Dockerfile
      image-scan-severity: high
      # Runs inside the image, as its own user, with /bin/sh: the console, the API schema
      # and the unprivileged user of the all-in-one image.
      image-smoke-command: |
        set -eu
        uvicorn --factory periplo.bootstrap:create_app &
        for _ in $(seq 30); do
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2)" 2>/dev/null && break
          sleep 1
        done
        python -c "import urllib.request as u; page = u.urlopen('http://127.0.0.1:8080/', timeout=5).read().decode(); assert '<title>Periplo</title>' in page, 'console not served'; u.urlopen('http://127.0.0.1:8080/openapi.json', timeout=5).read()"
        test "$(id -u)" = 10001
      codecov: true
      codecov-flag: api
      sonar: ${{ vars.SONAR_ENABLED == 'true' && github.actor != 'dependabot[bot]' }}
      sonar-blocking: false
      sonar-organization: massive-data-scope
      sonar-project-key: MassiveDataScope_periplo
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  node:
    permissions:
      contents: read
    uses: MassiveDataScope/loom-actions/.github/workflows/node-ci.yml@162f79c6b75e77b9f090df823db968cbb93fa817 # v1.13.3
    with:
      node-version: "22"
      workspaces: "@periplo/core periplo-web"
      e2e-command: "npm run test:e2e -w @periplo/core"
      e2e-workspace-dir: packages/core
      codecov: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    permissions:
      contents: read
      security-events: write # CodeQL alerts
      pull-requests: write # dependency review comment
      actions: read # CodeQL
    uses: MassiveDataScope/loom-actions/.github/workflows/repo-security.yml@1260b7861a6e5013daf36396fb4782c41e5a1c28 # v1.10.0
    with:
      gitleaks-config: .gitleaks.toml
      codeql-languages: "python,javascript-typescript"
      dependency-review: true
      # The generic publication scan, the tests of scripts/ and the check that the ETL
      # fixtures match their generator. The job has contents: read and no secrets.
      extra-check-command: "python3 scripts/publication_scan.py . && uv run --no-project --with pytest --with pyyaml pytest scripts/tests && node apps/web/dev/fixtures/generate-etl.mjs --check"
      extra-check-python-version: "3.14"
      extra-check-node-version: "22"

  docs:
    permissions:
      contents: read
    uses: MassiveDataScope/loom-actions/.github/workflows/pages.yml@1260b7861a6e5013daf36396fb4782c41e5a1c28 # v1.10.0
    with:
      deploy: false
      python-version: "3.14"
      # The same build as `make docs`; the full history lets hatch-vcs read the version.
      build-command: "uv run --project apps/api --locked --with-requirements docs/requirements.txt sphinx-build -E -W --keep-going -b html docs docs/_build/html"
      output-dir: docs/_build/html
      fetch-depth: 0

  # Trusted publishing: TestPyPI mints a token for this repository and ci.yml, for this
  # run. hatch-vcs reads the version from the tags, so the checkout keeps the history.
  testpypi:
    needs: python
    if: ${{ github.repository == 'MassiveDataScope/periplo' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.2"
          python-version: "3.14"
          enable-cache: false

      - name: Build the prerelease distributions
        working-directory: apps/api
        run: |
          set -euo pipefail
          uv build
          ls -1 dist

      - name: Check the distributions
        working-directory: apps/api
        env:
          TWINE_VERSION: "7.0.0"
        run: |
          set -euo pipefail
          uv tool run --from "twine==${TWINE_VERSION}" twine check --strict dist/*

      - name: Publish the prerelease to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 2026-07-28 (handles Metadata-Version 2.5)
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: apps/api/dist
          skip-existing: true

  gate:
    needs: [python, node, security, docs]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every check to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r '[to_entries[] | select(.value.result != "success") | "\(.key) (\(.value.result))"] | join(", ")' <<< "$NEEDS")
          if [ -n "$failed" ]; then echo "::error title=CI failed::$failed"; exit 1; fi
          echo "All checks succeeded."
