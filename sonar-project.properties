# SonarCloud project of the public repository. The key follows the repository name;
# the operator confirms it when importing the project, with Automatic Analysis off.
sonar.organization=massive-data-scope
sonar.projectKey=MassiveDataScope_periplo
sonar.projectName=Periplo
sonar.sourceEncoding=UTF-8

# CI passes the sources, tests and coverage report on the command line, prefixed
# with apps/api/. These exclusions keep generated and installed files out if the
# analysis ever widens.
sonar.exclusions=**/node_modules/**,**/.venv/**,**/coverage/**,**/dist/**,**/__pycache__/**
