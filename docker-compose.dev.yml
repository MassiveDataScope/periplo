# Development only: live-reloading UI in containers, against a simulated API
# until the real one exists. Independent of docker-compose.yml (the deployable
# base keeps exactly two services). Usage: `make dev`, then
#   app         http://localhost:5173
#   playground  http://localhost:5174
# Point the app at a real API with PERIPLO_API_URL=http://host.docker.internal:8000
name: periplo-dev

x-node: &node
  image: node:22-slim
  working_dir: /workspace
  init: true
  volumes:
    - .:/workspace
    # Linux dependencies live in volumes so they never mix with the host's macOS binaries.
    - root_modules:/workspace/node_modules
    - web_modules:/workspace/apps/web/node_modules
    - core_modules:/workspace/packages/core/node_modules

services:
  deps:
    <<: *node
    command: npm ci --no-audit --no-fund
    restart: "no"

  mock-api:
    <<: *node
    command: node apps/web/dev/mock-api.mjs
    depends_on:
      deps:
        condition: service_completed_successfully

  # The real API against the sources in config/sources.local.yaml (git-ignored), read-only.
  # Started only by `make dev-real`, which passes temporary AWS credentials from the host.
  api:
    profiles: [real]
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    working_dir: /workspace/apps/api
    init: true
    command: >
      sh -c "uv sync --frozen --no-dev --no-install-project --no-build-package datafusion --no-build-package deltalake --no-build-package pyarrow
      && uv run --no-sync uvicorn --factory periplo.bootstrap:create_app --app-dir src --host 0.0.0.0 --port 8000 --reload --reload-dir src"
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
      PERIPLO_SOURCES_FILE: /workspace/config/sources.local.yaml
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_EC2_METADATA_DISABLED: "true"
      # ETL console: off until PERIPLO_PREFECT_API_URL is set (see .env.etl.example).
      PERIPLO_PREFECT_API_URL: ${PERIPLO_PREFECT_API_URL:-}
      PERIPLO_PREFECT_API_KEY: ${PERIPLO_PREFECT_API_KEY:-}
      PERIPLO_PREFECT_AUTH_STRING: ${PERIPLO_PREFECT_AUTH_STRING:-}
      PERIPLO_PREFECT_UI_URL: ${PERIPLO_PREFECT_UI_URL:-}
      PERIPLO_PREFECT_TAGS: ${PERIPLO_PREFECT_TAGS:-}
      PERIPLO_PREFECT_TIMEOUT_SECONDS: ${PERIPLO_PREFECT_TIMEOUT_SECONDS:-10}
      PERIPLO_ETL_ALLOW_OPERATE: ${PERIPLO_ETL_ALLOW_OPERATE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/workspace:ro
      - api_venv:/venv
      - api_cache:/root/.cache/uv
    ports:
      - "127.0.0.1:${API_DEV_PORT:-8000}:8000"

  web:
    <<: *node
    command: npm run dev -w periplo-web -- --host 0.0.0.0 --port 5173 --strictPort
    environment:
      PERIPLO_API_URL: ${PERIPLO_API_URL:-http://mock-api:8765}
      # The company running this installation, shown under the product mark. Optional.
      VITE_BRAND_NAME: ${PERIPLO_BRAND_NAME:-}
      VITE_BRAND_LOGO_URL: ${PERIPLO_BRAND_LOGO_URL:-}
    ports:
      - "127.0.0.1:${WEB_DEV_PORT:-5173}:5173"
    depends_on:
      deps:
        condition: service_completed_successfully

  playground:
    <<: *node
    command: npm run playground -w @periplo/core -- --host 0.0.0.0
    ports:
      - "127.0.0.1:${PLAYGROUND_PORT:-5174}:5174"
    depends_on:
      deps:
        condition: service_completed_successfully

volumes:
  api_venv:
  api_cache:
  root_modules:
  web_modules:
  core_modules:
